
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ['jaxmarl*']

[tool.setuptools.dynamic]
version = {attr = "jaxmarl.__version__"}

[project]
name = "jaxmarl"
readme = "README.md"
description = "Multi-Agent Reinforcement Learning with JAX"
authors = [
    {name = "Foerster Lab for AI Research", email = "arutherford@robots.ox.ac.uk"},
  ]
dynamic = ["version"]
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
]
# Pinned to the JAX 0.5.3 / Flax 0.10.5 stack (both released March 2025).
# Upper bounds are load-bearing, not cosmetic: chex >= 0.1.90, distrax >= 0.1.6
# and orbax-checkpoint >= 0.12 all require jax >= 0.6/0.7, and scipy >= 1.16
# drops the numpy < 2.5 pin this stack is validated against.
# GPU wheels come from the `cuda` extra; nvidia-* CUDA 12.9 libraries satisfy
# jax-cuda12-plugin's `>=` bounds, so CUDA 12.9 is the supported runtime.
dependencies = [
  "jax==0.5.3",
  "jaxlib==0.5.3",
  "numpy>=1.26,<2.3",
  "scipy>=1.11.1,<1.16",
  "ml_dtypes>=0.4.0,<0.5.2",  # jaxlib 0.5.3 registers dtypes against the 0.5.1-era ml_dtypes
  "flax==0.10.5",
  "orbax-checkpoint>=0.11.0,<0.12",
  "chex>=0.1.87,<0.1.90",
  "safetensors",
  "matplotlib",
  "pillow",
  "jaxtyping>=0.2.28",
  "gymnax",
]


[project.optional-dependencies]
algs = [
  "optax>=0.2.4,<0.2.5",
  "distrax==0.1.5",
  # distrax 0.1.5 runs on the TFP JAX substrate; 0.25.0 is the first release
  # that supports numpy 2.x.
  "tensorflow-probability>=0.25.0",
  "flashbax>=0.1.0",
  "wandb",
  "python-dotenv>=1.0.1",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "tqdm>=4.66.0",
  "imageio",
  "imageio-ffmpeg>=0.5.1",
]
dev = [
  "pytest",
  "mpe2",
  "ruff",
  "pyright",
]
mabrax = [
  "brax>=0.10.3",
]
cuda = [
  "jax[cuda12]==0.5.3",
]

[project.urls]
"Homepage" = "https://github.com/FLAIROx/JaxMARL"
"Bug Tracker" = "https://github.com/FLAIROx/JaxMARL/issues"

[tool.pyright]
include = [
  "jaxmarl/environments/multi_agent_env.py",
  "jaxmarl/environments/spaces.py",
  "jaxmarl/wrappers/baselines.py",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = false
reportMissingModuleSource = false
reportCallIssue = false
reportAttributeAccessIssue = false
reportIndexIssue = false

[tool.pytest.ini_options]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["build/", ".cache/", "jaxmarl/tutorials/"]
# Newer ruff formats Python code blocks inside Markdown; the repo's existing
# .md files predate that and are not formatted to it. Exclude Markdown so
# `ruff format --check` matches the repo's actual (Python-only) style policy.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501", "F722"]   # E501: line length; F722: jaxtyping scalar annotations ("") are valid but unparseable by ruff

[tool.ruff.lint.per-file-ignores]
# baselines: research/experiment scripts with relaxed style requirements
"baselines/**" = ["E402", "E711", "E731", "E741", "F401", "F811", "F841", "I001"]
# tests: use star imports from jaxmarl
"tests/**" = ["F401", "F403", "F405", "F841"]
# older environment implementations not yet updated to 2.0 style
"jaxmarl/environments/**" = ["E722", "E731", "E741", "F401", "F403", "F405", "F811", "F821", "F841"]
"jaxmarl/gridworld/**" = ["E722", "E731", "E741", "F401", "F403", "F405", "F811", "F821", "F841"]
"jaxmarl/viz/**" = ["E722", "F401", "F821", "F841"]
