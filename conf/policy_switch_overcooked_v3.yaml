defaults:
  - _self_
  - recording: disabled
  - scenario: dynamic_00

ENV_NAME: overcooked_v3
ALGORITHM: PolicySwitch-IPPO
ARCHITECTURE: cnn
ENV_KWARGS:
  layout: dynamic_00
  max_steps: 400
  random_agent_positions: false
  include_transition_countdown: true
  include_layout_change_mask: true
  include_signal_status: true
  transition_warning_steps: 20
  signal_activation_time: 10
  signal_activation_cost: 0.0

# TOTAL_TIMESTEPS is applied independently to every unique phase policy.
LR: 0.00025
ANNEAL_LR: true
LR_WARMUP: 0.05
NUM_ENVS: 256
NUM_STEPS: 256
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 64
TOTAL_TIMESTEPS: 3e7
REW_SHAPING_HORIZON: 1.5e7

FC_DIM_SIZE: 128
GRU_HIDDEN_DIM: 128
CLIP_EPS: 0.2
ENT_COEF: 0.01
GAMMA: 0.99
GAE_LAMBDA: 0.95
SCALE_CLIP_EPS: false
VF_COEF: 0.5
MAX_GRAD_NORM: 0.25
ACTIVATION: relu

SEED: 0
NUM_SEEDS: 1
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 0
upload_final_checkpoint: true

SAVES_DIR: saves
EXPERIMENT_FOLDER: policy-switch

ENTITY: ${oc.env:WANDB_ENTITY,cilab-overcooked}
PROJECT: ${oc.env:WANDB_PROJECT,overcooked-v3-role-coordination}
wandb_mode: ${oc.env:WANDB_MODE,online}
WANDB_GROUP: policy-switch
POLICY_SWITCH_WANDB_GROUP: policy-switch
WANDB_TAGS: []
RUN_NAME: null
NOTES: null
