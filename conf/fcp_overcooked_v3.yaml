defaults:
  - _self_
  - recording: enabled
  - scenario: dynamic_00

ENV_NAME: overcooked_v3
ALGORITHM: FCP
ARCHITECTURE: rnn
ENV_KWARGS:
  layout: dynamic_00
  random_agent_positions: false
  include_transition_countdown: true
  include_layout_change_mask: true
  transition_warning_steps: 20

# OvercookedV2 FCP hyperparameters, retaining the V3 rollout scale.
LR: 0.0007
ANNEAL_LR: true
LR_WARMUP: 0.05

NUM_ENVS: 256
NUM_STEPS: 256
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 64

TOTAL_TIMESTEPS: 3e7
REW_SHAPING_HORIZON: 1.5e7

FC_DIM_SIZE: 128
GRU_HIDDEN_DIM: 128

CLIP_EPS: 0.2
ENT_COEF: 0.04
GAMMA: 0.99
GAE_LAMBDA: 0.9
SCALE_CLIP_EPS: false
VF_COEF: 0.5
MAX_GRAD_NORM: 0.25
ACTIVATION: relu
SEED: 0
NUM_SEEDS: 1
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 0
upload_final_checkpoint: true

SAVES_DIR: saves
EXPERIMENT_FOLDER: fcp

FCP:
  # Train the population sweep with SAVES_DIR=<root>/fcp_population.
  population_dir: ${SAVES_DIR}/fcp_population
  snapshots_per_policy: 3
  minimum_population_size: 2
  max_population_size: null

ENTITY: ${oc.env:WANDB_ENTITY,cilab-overcooked}
PROJECT: ${oc.env:WANDB_PROJECT,overcooked-v3-fcp_train}
wandb_mode: ${oc.env:WANDB_MODE,online}
WANDB_GROUP: null
WANDB_TAGS: [FCP]
RUN_NAME: null
NOTES: null
