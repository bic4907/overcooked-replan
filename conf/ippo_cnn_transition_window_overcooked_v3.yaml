defaults:
  - ippo_overcooked_v3
  - _self_

ARCHITECTURE: cnn
ALGORITHM: IPPO-CNN

# The same observation the recurrent arm was trained under: A/B are the fixed
# Overcooked identities agent_0/agent_1, and the environment masks only the
# transition signal, never the shape.
TRANSITION_OBSERVER: both
ENV_KWARGS:
  transition_observer: ${TRANSITION_OBSERVER}

PROJECT: ${oc.env:WANDB_PROJECT,overcooked-v3-ippo-cnn-transition-window_train}
EXPERIMENT_FOLDER: transition-window-${TRANSITION_OBSERVER}
WANDB_GROUP: transition-window-${CONDITION}
WANDB_TAGS:
  - transition-window-observer
  - observer-${TRANSITION_OBSERVER}
RUN_NAME: ippo_cnn_${CONDITION}_observer-${TRANSITION_OBSERVER}_seed${SEED}
NOTES: Selective transition-window observation; A=agent_0 and B=agent_1.
