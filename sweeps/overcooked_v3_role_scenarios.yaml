name: overcooked-v3-role-scenarios
program: baselines/IPPO/ippo_overcooked_v3.py
project: overcooked-v3-role-coordination
method: grid
run_cap: 20

metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - split_no_sig
      - split_sig
      - outage_no_sig
      - outage_sig
  SEED:
    values: [0, 1, 2, 3, 4]
  NUM_SEEDS:
    value: 1
  ARCHITECTURE:
    value: cnn
  PROJECT:
    value: overcooked-v3-role-coordination
  WANDB_MODE:
    value: online
  SAVES_DIR:
    value: saves
  EXPERIMENT_FOLDER:
    value: role-scenarios
  recording:
    value: enabled
  RECORD_MAX_STEPS:
    value: 400
  RECORD_VIDEO_FPS:
    value: 5
  RECORD_VIDEO_QUALITY:
    value: 5

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
