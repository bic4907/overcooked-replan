# Stage 3a, the fourth arm: the prior played straight, with no cloning.
#
# It is the reference for what the network can do before a single human action
# is fitted, which is what makes "the prior already solves it" and "cloning
# helped" distinguishable.

program: baselines/OBP/eval_human_model.py
name: obp-eval-prior
method: grid
metric:
  goal: maximize
  name: return_mean

parameters:
  arm:
    value: prior
  seed:
    values: [0, 1, 2, 3, 4, 5]
  prior-root:
    value: saves/obp_prior
  prior-architecture:
    value: cnn
  layout:
    value: split_0
  episodes:
    value: 50
  max-steps:
    value: 450
  data:
    value: data/human
  project:
    value: overcooked-v3-obp-eval
  group:
    value: obp_eval_prior

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
