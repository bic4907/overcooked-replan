# Stage 3b: does best-responding to a better human model give a better teammate?
#
# One evaluation human -- cloned from the episodes no arm trained on -- plays
# split_0 with each of the four collaborative agents:
#
#   SP              the prior, which is its own best response
#   BR(bc)          best response to the randomly-initialised human model
#   BR(obp)         best response to the prior-initialised one
#   BR(obp_frozen)       best response to the paper's frozen one
#   BR(obp_frozen_conv)  best response to the frozen-trunk one
#
# The human side is identical across all four, so the returns are directly
# comparable and the only thing that varies is which human model the teammate
# was trained to complement. This is the paper's H2.

program: baselines/OBP/eval_human_model.py
name: obp-br-eval
method: grid
metric:
  goal: maximize
  name: return_mean

parameters:
  partner-arm:
    values: [prior, bc, obp, obp_frozen, obp_frozen_conv]
  seed:
    values: [0, 1, 2, 3, 4, 5]
  arm:
    value: bc
  model-root:
    value: saves/obp_eval_human
  partner-br-root:
    value: saves/obp_br
  partner-prior-root:
    value: saves/obp_prior
  partner-architecture:
    value: cnn
  layout:
    value: split_0
  episodes:
    value: 50
  max-steps:
    value: 450
  data:
    value: data/human
  project:
    value: overcooked-v3-obp-eval
  group:
    value: obp_br_eval

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
