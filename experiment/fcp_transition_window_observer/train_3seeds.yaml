program: baselines/FCP/fcp_overcooked_v3.py
name: fcp-transition-window-observer-best-response-3seeds
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Run only after population_3seeds finishes on the same persistent filesystem.
parameters:
  scenario:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - recipe_switch_0
      - recipe_switch_1
      - distance_switch_0
      - distance_switch_1
  TRANSITION_OBSERVER:
    values:
      - none
      - agent_0
      - agent_1
      - both
  SEED:
    values: [0, 1, 2]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-transition-window-3seed_train
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - fcp_transition_window_overcooked_v3
  - ${args_no_hyphens}
