program: baselines/IPPO/ippo_overcooked_v3.py
name: fcp-transition-window-paper01-v2-population
method: grid
metric:
  goal: maximize
  name: train/episode_return

# 6 layouts x 4 observer arms x 3 seeds = 72 runs. Each run writes 10%, 50%,
# and 100% snapshots, yielding nine frozen partners per layout/observer arm.
parameters:
  scenario:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - distance_switch_0
      - distance_switch_1
  TRANSITION_OBSERVER:
    values: [none, agent_0, agent_1, both]
  SEED:
    values: [0, 1, 2]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-transition-window-paper01-v2_population
  POPULATION_ROOT:
    value: saves/fcp_transition_window_paper01_v2/population
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - fcp_population_transition_window_overcooked_v3
  - ${args_no_hyphens}
