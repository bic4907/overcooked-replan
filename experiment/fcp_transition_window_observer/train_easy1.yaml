program: baselines/FCP/fcp_overcooked_v3.py
name: fcp-transition-window-easy1-only-best-response
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Run only after population_easy1.yaml finishes on the same filesystem.
# 3 layouts x 4 observer arms x 6 seeds = 72 best-response runs.
parameters:
  scenario:
    values: [split_1, outage_1, distance_switch_1]
  TRANSITION_OBSERVER:
    values: [none, agent_0, agent_1, both]
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-transition-window-easy1_train
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - fcp_transition_window_overcooked_v3
  - ${args_no_hyphens}
