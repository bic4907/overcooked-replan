program: baselines/IPPO/ippo_overcooked_v3.py
name: adaptation-policy-switch-trained-no-coplayer-action
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Ten unordered pairs from the five original Overcooked-AI layouts. Each
# 400-step episode cycles A(100) -> B(100) -> A(100) -> B(100). The policy sees
# the normal full-grid observation, including the other agent's visible state,
# but receives no explicit co-player action, countdown, or change mask.
parameters:
  ENV_KWARGS.layout:
    values:
      - multilayout_cramped_room__asymm_advantages
      - multilayout_cramped_room__coord_ring
      - multilayout_cramped_room__forced_coord
      - multilayout_cramped_room__counter_circuit
      - multilayout_asymm_advantages__coord_ring
      - multilayout_asymm_advantages__forced_coord
      - multilayout_asymm_advantages__counter_circuit
      - multilayout_coord_ring__forced_coord
      - multilayout_coord_ring__counter_circuit
      - multilayout_forced_coord__counter_circuit
  ENV_KWARGS.layout_mode:
    value: cyclic
  ENV_KWARGS.max_steps:
    value: 400
  ENV_KWARGS.reset_on_layout_change:
    value: true
  ENV_KWARGS.include_transition_countdown:
    value: false
  ENV_KWARGS.include_layout_change_mask:
    value: false
  ENV_KWARGS.include_signal_status:
    value: false
  ARCHITECTURE:
    value: cnn
  EXPERIMENT:
    value: adaptation_policy_switch_trained
  WANDB_GROUP:
    value: adaptation-policy-switch-trained-no-coplayer-action
  WANDB_TAGS:
    value: [adaptation-policy, switch-trained, no-coplayer-action, original-layouts-9x7]
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  NUM_SEEDS:
    value: 1
  EXPERIMENT_FOLDER:
    value: original-layouts-9x7-switch-no-coplayer-action-v1
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
