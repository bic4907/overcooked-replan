program: baselines/IPPO/eval_crossplay_overcooked_v3.py
name: adaptation-policy-switch-trained-no-coplayer-action-eval
method: grid
metric:
  goal: maximize
  name: XP

# One evaluation run per dynamic layout pair. For each pair, the evaluator
# selects seeds 0..5 from the 2a training project and computes all 36 ordered
# combinations: 6 SP diagonal entries and 30 XP off-diagonal entries.
parameters:
  algorithms:
    value: IPPO
  layout:
    values:
      - multilayout_cramped_room__asymm_advantages
      - multilayout_cramped_room__coord_ring
      - multilayout_cramped_room__forced_coord
      - multilayout_cramped_room__counter_circuit
      - multilayout_asymm_advantages__coord_ring
      - multilayout_asymm_advantages__forced_coord
      - multilayout_asymm_advantages__counter_circuit
      - multilayout_coord_ring__forced_coord
      - multilayout_coord_ring__counter_circuit
      - multilayout_forced_coord__counter_circuit
  episodes:
    value: 50
  max-steps:
    value: 400
  run-state:
    value: finished
  workers-per-gpu:
    value: 8

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - cilab-overcooked/overcooked-v3-switch-trained-no-coplayer-action_train
  - --seeds
  - "0"
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - ${args_no_equals}
