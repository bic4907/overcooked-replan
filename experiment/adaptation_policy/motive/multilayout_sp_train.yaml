program: baselines/IPPO/ippo_overcooked_v3.py
name: adaptation-policy-multilayout-sp
method: grid
metric:
  goal: maximize
  name: train/episode_return

# 5 original-map specialists + all 10 two-map combinations, each with 6 seeds.
parameters:
  ENV_KWARGS.layout:
    values:
      - cramped_room
      - asymm_advantages
      - coord_ring
      - forced_coord
      - counter_circuit
      - multilayout_cramped_room__asymm_advantages
      - multilayout_cramped_room__coord_ring
      - multilayout_cramped_room__forced_coord
      - multilayout_cramped_room__counter_circuit
      - multilayout_asymm_advantages__coord_ring
      - multilayout_asymm_advantages__forced_coord
      - multilayout_asymm_advantages__counter_circuit
      - multilayout_coord_ring__forced_coord
      - multilayout_coord_ring__counter_circuit
      - multilayout_forced_coord__counter_circuit
  ENV_KWARGS.layout_mode:
    value: episode_random
  ENV_KWARGS.include_transition_countdown:
    value: false
  ENV_KWARGS.include_layout_change_mask:
    value: false
  ENV_KWARGS.include_signal_status:
    value: false
  EXPERIMENT:
    value: adaptation_policy
  WANDB_GROUP:
    value: adaptation-policy-multilayout-sp
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  NUM_SEEDS:
    value: 1
  EXPERIMENT_FOLDER:
    value: original-layouts-9x7-v1
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
