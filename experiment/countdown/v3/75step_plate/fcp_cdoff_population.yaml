# The silent arm of the 75-step benchmark: the same six kitchens, the same
# 450-step episodes and the same 75-step phase clock as the 09-15 baseline,
# with the transition signal unreadable.
#
# The countdown and change-mask channels stay in the observation and are held
# at zero by the observer gate (TRANSITION_OBSERVER=none), so this arm and the
# baseline hand the policy the same 31 channels and differ only in what those
# two carry. A width-matched pair is what lets one evaluator and one plot hold
# both arms.
#
# Nothing else announces a boundary: the base observation has no clock, and
# these layouts schedule no recipes, so the next-recipe channel is absent. A
# convolutional policy therefore cannot know a change is coming; a recurrent
# one can still count steps, since the 75-step cadence never varies. That gap
# is the reading this arm is for.
#
# Scoring is the common switchmap protocol, identical to the baseline's:
# 450-step episodes with boundaries every 75 steps, 20 episodes per ordered
# seed pair, every pair of the six training seeds.
#
# Stage 2: the frozen partners the cdoff best response is trained against. Each
# seed uploads snapshots at 10, 50 and 100 percent, so a layout ends with 18
# partners. POPULATION_ROOT is scoped to this arm on purpose: discovery filters
# on architecture and layout only, and now that every arm shares one
# observation width a wrong root no longer fails loudly -- it quietly hands one
# arm the other arm's partners.

program: baselines/IPPO/ippo_overcooked_v3.py
name: v3-75step-plate-cdoff-fcp-population
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - distance_0
      - distance_1
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  TRANSITION_OBSERVER:
    value: none
  ENV_KWARGS.layout_mode:
    value: cyclic
  ALGORITHM:
    value: IPPO-SP-cdoff
  POPULATION_ROOT:
    value: saves/75step_plate_0915/cdoff/fcp_population
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-cdoff-75step-plate-0915_population
  WANDB_TAGS:
    value: "[0915, 75-step, plate-outage, FCP-Population, cdoff]"
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - fcp_population_transition_window_overcooked_v3
  - ${args_no_hyphens}
