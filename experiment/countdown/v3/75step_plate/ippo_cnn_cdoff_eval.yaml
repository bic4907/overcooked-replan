# The silent arm of the 75-step benchmark: the same six kitchens, the same
# 450-step episodes and the same 75-step phase clock as the 09-15 baseline,
# with the transition signal unreadable.
#
# The countdown and change-mask channels stay in the observation and are held
# at zero by the observer gate (TRANSITION_OBSERVER=none), so this arm and the
# baseline hand the policy the same 31 channels and differ only in what those
# two carry. A width-matched pair is what lets one evaluator and one plot hold
# both arms.
#
# Nothing else announces a boundary: the base observation has no clock, and
# these layouts schedule no recipes, so the next-recipe channel is absent. A
# convolutional policy therefore cannot know a change is coming; a recurrent
# one can still count steps, since the 75-step cadence never varies. That gap
# is the reading this arm is for.
#
# Scoring is the common switchmap protocol, identical to the baseline's:
# 450-step episodes with boundaries every 75 steps, 20 episodes per ordered
# seed pair, every pair of the six training seeds.
#
# The evaluator rebuilds the environment from each run's observation config and
# never copies layout_mode, so every cell is scored on the cyclic 75-step
# schedule. The metric windows match the 09-15 baseline evaluation exactly,
# which is what makes the arms comparable.

program: baselines/IPPO/eval_crossplay_overcooked_v3.py
name: v3-75step-plate-cdoff-ippo_cnn-eval
method: grid
metric:
  goal: maximize
  name: XP

parameters:
  algorithms:
    value: IPPO-CNN-cdoff
  layout:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - distance_0
      - distance_1
  transition-observer:
    value: none
  episodes:
    value: 20
  max-steps:
    value: 450
  adaptation-window:
    value: 30
  adaptation-horizon:
    value: 75
  drop-baseline-window:
    value: 60
  drop-horizon:
    value: 60
  workers-per-gpu:
    value: 8
  entity:
    value: cilab-overcooked
  output-project:
    value: cilab-overcooked/overcooked-v3-ippo-cdoff-cnn-75step-plate-0915_eval

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - cilab-overcooked/overcooked-v3-ippo-cdoff-cnn-75step-plate-0915_train
  - --seeds
  - "0"
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - ${args_no_equals}
