program: baselines/IPPO/ippo_overcooked_v3.py
name: ippo-rnn-transition-window-observer-3seeds
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - recipe_switch_0
      - recipe_switch_1
      - distance_switch_0
      - distance_switch_1
  TRANSITION_OBSERVER:
    values:
      - none
      - agent_0
      - agent_1
      - both
  SEED:
    values: [0, 1, 2]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-ippo-rnn-transition-window-3seed_train
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - ippo_rnn_transition_window_overcooked_v3
  - ${args_no_hyphens}
