program: baselines/IPPO/ippo_overcooked_v3.py
name: ippo-rnn-transition-window-easy1-only
method: grid
metric:
  goal: maximize
  name: train/episode_return

# 3 layouts x 4 observer arms x 6 seeds = 72 runs.
parameters:
  scenario:
    values: [split_1, outage_1, distance_switch_1]
  TRANSITION_OBSERVER:
    values: [none, agent_0, agent_1, both]
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-ippo-rnn-transition-window-easy1_train
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - ippo_rnn_transition_window_overcooked_v3
  - ${args_no_hyphens}
