program: baselines/IPPO/eval_crossplay_overcooked_v3.py
name: self-play-seedwise-xp
method: grid
metric:
  goal: maximize
  name: XP

parameters:
  algorithms:
    value: IPPO
  layout:
    values:
      - splitnosig_0
      - splitnosig_1
      - splitnosig_2
      - outagenosig_0
      - outagenosig_1
      - outagenosig_2
  episodes:
    value: 20
  max-steps:
    value: 400
  workers-per-gpu:
    value: 8

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
