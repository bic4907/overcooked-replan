program: baselines/IPPO/ippo_overcooked_v3.py
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - splitnosig_0
      - splitnosig_1
      - splitnosig_2
      - splitsig_0
      - splitsig_1
      - splitsig_2
      - outagenosig_0
      - outagenosig_1
      - outagenosig_2
      - outagesig_0
      - outagesig_1
      - outagesig_2
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  recording:
    value: enabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
