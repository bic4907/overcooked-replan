program: baselines/IPPO/ippo_overcooked_v3.py
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - split_no_sig
      - split_sig
      - outage_no_sig
      - outage_sig
  SEED:
    values: [0, 1]
  recording:
    value: enabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
