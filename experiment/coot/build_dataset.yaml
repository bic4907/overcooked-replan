program: baselines/CooT/pipeline_stage_overcooked_v3.py
name: coot-build-training-datasets-reindexed-v2
method: grid
metric:
  goal: maximize
  name: pipeline/completed

parameters:
  stage:
    value: build_dataset
  layout:
    values: [split_0, split_1, outage_0, outage_1, recipe_switch_0, recipe_switch_1, distance_switch_0, distance_switch_1]
  # Must match score_and_select.yaml so pair construction resolves the same 21
  # HSP-only proxy members.
  allow-low-return-fill:
    value: true
  entity:
    value: cilab-overcooked
  project:
    value: overcooked-v3-coot-pipeline

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
