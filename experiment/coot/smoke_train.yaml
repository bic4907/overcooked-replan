program: baselines/CooT/train_overcooked_v3.py
name: coot-smoke-transformer-train
method: grid
metric:
  goal: minimize
  name: validation/loss

# Requires a horizon-1 dataset at datasets/coot_smoke/split_0. Two seeds make
# the optional smoke SP/XP matrix runnable after this stage.
parameters:
  scenario:
    value: split_0
  SEED:
    values: [0, 1]
  BATCH_SIZE:
    value: 1
  EXAMPLES_PER_EPOCH:
    value: 1
  VALIDATION_BATCHES:
    value: 1
  MAX_EPOCHS:
    value: 1
  PATIENCE:
    value: 1
  RUNTIME_CONTEXT_UPDATE_STEPS:
    value: 1
  DATASET_ROOT:
    value: datasets/coot_smoke
  SAVES_DIR:
    value: saves/coot_smoke/train
  EXPERIMENT_FOLDER:
    value: smoke_train
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-coot-smoke
  WANDB_GROUP:
    value: coot-smoke-train

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
