program: baselines/IPPO/ippo_overcooked_v3.py
name: coot-hsp-population-other
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Table-5 "Others" has exactly 52 valid candidates after the <=3 non-zero
# variable-term filter. Keeping it separate from the 72-candidate multi-recipe
# sweep prevents invalid Cartesian-product runs.
parameters:
  scenario:
    values:
      - split_0
      - split_1
      - split_2
      - outage_0
      - outage_1
      - outage_2
      - distance_switch_0
      - distance_switch_1
      - distance_switch_2
  HSP.PROFILE:
    value: other
