program: baselines/CooT/pipeline_stage_overcooked_v3.py
name: coot-score-and-select-hsp-reindexed-v2
method: grid
metric:
  goal: maximize
  name: pipeline/completed

parameters:
  stage:
    value: score_and_select
  layout:
    values: [split_0, split_1, outage_0, outage_1, recipe_switch_0, recipe_switch_1, distance_switch_0, distance_switch_1]
  score-episodes:
    value: 50
  # V3 can yield fewer than 21 candidates above the release's sparse-return
  # threshold. This is allowed only for the already-explicit HSP-only proxy and
  # is recorded in the generated manifest as low_return_hsp_fill.
  allow-low-return-fill:
    value: true
  entity:
    value: cilab-overcooked
  project:
    value: overcooked-v3-coot-pipeline

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
