program: baselines/CooT/train_best_response_overcooked_v3.py
name: coot-smoke-response
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Requires manifests/coot/smoke/response_jobs/split_0.json and the population
# smoke checkpoint referenced by job 0. The wrapper validates both before JIT.
parameters:
  RESPONSE_JOB_STAGE:
    value: smoke
  scenario:
    value: split_0
  JOB_INDEX:
    value: 0
  ENV_KWARGS.max_steps:
    value: 1
  NUM_ENVS:
    value: 1
  NUM_STEPS:
    value: 1
  TOTAL_TIMESTEPS:
    value: 1
  UPDATE_EPOCHS:
    value: 1
  NUM_MINIBATCHES:
    value: 1
  LOG_INTERVAL:
    value: 1
  CHECKPOINT_FRACTIONS:
    value: []
  UPLOAD_INTERMEDIATE_CHECKPOINTS:
    value: false
  SAVES_DIR:
    value: saves/coot_smoke/responses
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-coot-smoke

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
