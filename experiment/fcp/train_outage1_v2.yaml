program: baselines/FCP/fcp_overcooked_v3.py
name: fcp-outage1-v2-best-response
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    value: outage_1
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-outage1-v2_train
  SAVES_DIR:
    value: saves/fcp_outage1_v2
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
