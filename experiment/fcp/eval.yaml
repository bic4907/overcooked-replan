program: baselines/IPPO/eval_crossplay_overcooked_v3.py
name: fcp-seedwise-xp
method: grid
metric:
  goal: maximize
  name: XP

parameters:
  algorithms:
    value: FCP
  layout:
    values:
      - splitnosig_0
      - splitnosig_1
      - splitnosig_2
      - splitsig_0
      - splitsig_1
      - splitsig_2
      - outagenosig_0
      - outagenosig_1
      - outagenosig_2
      - outagesig_0
      - outagesig_1
      - outagesig_2
  episodes:
    value: 20
  max-steps:
    value: 400
  workers-per-gpu:
    value: 8

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - inchangbaek4907/overcooked-v3-role-coordination
  - ${args_no_equals}
