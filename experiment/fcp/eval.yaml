program: baselines/IPPO/eval_crossplay_overcooked_v3.py
name: fcp-role-scenarios-seedwise-xp
method: grid
metric:
  goal: maximize
  name: XP

parameters:
  algorithms:
    value: FCP
  layout:
    values:
      - split_0
      - split_1
      - split_2
      - outage_0
      - outage_1
      - outage_2
      - recipe_switch_0
      - recipe_switch_1
      - recipe_switch_2
      - distance_switch_0
      - distance_switch_1
      - distance_switch_2
  episodes:
    value: 20
  max-steps:
    value: 450
  workers-per-gpu:
    value: 8
  entity:
    value: cilab-overcooked
  output-project:
    value: cilab-overcooked/overcooked-v3-fcp_eval

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - cilab-overcooked/overcooked-v3-fcp_train
  - ${args_no_equals}
