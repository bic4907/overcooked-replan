program: baselines/FCP/fcp_overcooked_v3.py
name: fcp-easy1-recovery1-best-response
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Full replacement after the original best-response sweep was interrupted
# before any run finished. Population checkpoints are restored from the
# verified W&B recovery artifact documented in runpod_easy1_baseline_state.md.
parameters:
  scenario:
    values: [split_1, outage_1, distance_switch_1]
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-easy1-recovery1_train
  SAVES_DIR:
    value: saves/fcp_easy1
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
