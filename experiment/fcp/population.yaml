program: baselines/IPPO/ippo_overcooked_v3.py
name: fcp-role-scenarios-population
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Six independent RNN policies per layout. Each run saves 10/50/100% checkpoints.
parameters:
  scenario:
    values:
      - split_0
      - split_1
      - outage_0
      - outage_1
      - distance_0
      - distance_1
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp-population
  ARCHITECTURE:
    value: rnn
  SAVES_DIR:
    value: saves/fcp_population
  CHECKPOINT_INTERVAL:
    value: 0
  CHECKPOINT_FRACTIONS:
    value: [0.1, 0.5, 1.0]
  upload_final_checkpoint:
    value: false
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
