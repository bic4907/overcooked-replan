program: baselines/IPPO/ippo_overcooked_v3.py
name: fcp-self-play
method: grid
metric:
  goal: maximize
  name: train/episode_return

# Based on experiment/self_play/train.yaml with additional RNN snapshot
# settings for the frozen FCP partner population.
parameters:
  scenario:
    values:
      - splitnosig_0
      - splitnosig_1
      - splitnosig_2
      - splitsig_0
      - splitsig_1
      - splitsig_2
      - outagenosig_0
      - outagenosig_1
      - outagenosig_2
      - outagesig_0
      - outagesig_1
      - outagesig_2
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ARCHITECTURE:
    value: rnn
  SAVES_DIR:
    value: saves/fcp_population
  CHECKPOINT_INTERVAL:
    value: 152
  upload_final_checkpoint:
    value: false
  recording:
    value: disabled

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
