program: baselines/FCP/fcp_overcooked_v3.py
name: fcp-role-scenarios-best-response
method: grid
metric:
  goal: maximize
  name: train/episode_return

parameters:
  scenario:
    values:
      - split_0
      - split_1
      - split_2
      - outage_0
      - outage_1
      - outage_2
      - recipe_switch_0
      - recipe_switch_1
      - recipe_switch_2
      - distance_switch_0
      - distance_switch_1
      - distance_switch_2
  SEED:
    values: [0, 1, 2, 3, 4, 5]
  ENTITY:
    value: cilab-overcooked
  PROJECT:
    value: overcooked-v3-fcp_train

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
