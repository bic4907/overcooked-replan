# What every agent we have is worth next to a cook that stands in for a person.
#
# Rows are the heuristic cook at four settings of its dials: BR, which plays as
# well as it can, and H0, H1 and H2, which wait or wander enough to pass for
# someone who has not done this before. Columns are those four and the three
# policies trained on the kitchen -- IPPO CNN, IPPO RNN, FCP -- all
# countdown-on. Every one of the ten kitchens has six seeds of all three, so the
# grid is 4 x 7 x 10.
#
# Each cell is one run of twelve games: the partner's six training seeds, each
# played in both seat orders, so neither a lucky seed nor who sits where decides
# it. Two planners have no training seed, so their cell is six episode seeds in
# both orders instead.

program: baselines/planner/eval_planner_partner.py
name: planner-human-matrix
method: grid
metric:
  goal: maximize
  name: return_mean

parameters:
  human:
    values: [br, h0, h1, h2]
  partner:
    values: [br, h0, h1, h2, cnn, rnn, fcp]
  layout:
    values:
      - split_0
      - split_wide
      - outage_0
      - outage_2
      - outage_2_plate
      - outage_wide
      - outage_wide_2
      - outage_wide_2_plate
      - distance_switch_0
      - distance_switch_wide
  seeds:
    value: 6
  episodes:
    value: 1
  max-steps:
    value: 450
  project:
    value: overcooked-v3-obp-human-matrix

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_equals}
