program: baselines/PolicySwitch/eval_all_overcooked_v3.py
name: policy-switch-role-scenarios-seedwise-xp
method: grid
metric:
  goal: maximize
  name: XP

parameters:
  algorithms:
    value: PolicySwitch-IPPO
  layout:
    values:
      - split_0
      - split_1
      - split_2
      - outage_0
      - outage_1
      - outage_2
      - recipe_switch_0
      - recipe_switch_1
      - recipe_switch_2
      - distance_switch_0
      - distance_switch_1
      - distance_switch_2
  episodes:
    value: 20
  max-steps:
    value: 450
  entity:
    value: cilab-overcooked
  output-project:
    value: cilab-overcooked/overcooked-v3-policyswitch_eval

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - cilab-overcooked/overcooked-v3-policyswitch_train
  - ${args_no_equals}
